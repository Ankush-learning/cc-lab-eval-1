<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="tpGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#34D399" stop-opacity="0.0"/>
        </linearGradient>
    </defs>
    
    <rect width="1200" height="675" rx="16" fill="#0B0F19"/>
    <rect x="1" y="1" width="1198" height="673" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

    <!-- Header Badge -->
    <rect x="470" y="32" width="260" height="32" rx="16" fill="#1E293B"/>
    <text x="600" y="53" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">THROUGHPUT CAPACITY CURVE</text>

    <text x="600" y="98" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Concurrent Requests vs Throughput (req/sec)</text>
    <text x="600" y="123" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Measured system processing capacity across workload levels W1 to W5</text>

    <!-- Chart Frame -->
    <rect x="100" y="160" width="1000" height="420" rx="12" fill="#0F172A" stroke="#1E293B"/>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="140" y1="530" x2="1060" y2="530" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="534" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">0 req/s</text>

    <line x1="140" y1="450" x2="1060" y2="450" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="454" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">35 req/s</text>

    <line x1="140" y1="370" x2="1060" y2="370" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="374" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">70 req/s</text>

    <line x1="140" y1="290" x2="1060" y2="290" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="294" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">105 req/s</text>

    <line x1="140" y1="210" x2="1060" y2="210" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="214" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">140 req/s</text>

    <line x1="140" y1="180" x2="1060" y2="180" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="184" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">175 req/s</text>

    <!-- X-Axis Labels -->
    <text x="180" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W1 (1 Concurrent)</text>
    <text x="390" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W2 (2 Concurrent)</text>
    <text x="600" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W3 (4 Concurrent)</text>
    <text x="810" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W4 (8 Concurrent)</text>
    <text x="1020" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W5 (16 Concurrent)</text>

    <line x1="140" y1="530" x2="1060" y2="530" stroke="#64748B" stroke-width="2"/>

    <!-- Area Gradient & Line Path -->
    <path d="M 180 405.77 L 390 323.16 L 600 242.5 L 810 192.62 L 1020 205.22 L 1020 530 L 180 530 Z" fill="url(#tpGrad)"/>
    <path d="M 180 405.77 C 285 405.77, 285 323.16, 390 323.16 C 495 323.16, 495 242.5, 600 242.5 C 705 242.5, 705 192.62, 810 192.62 C 915 192.62, 915 205.22, 1020 205.22" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>

    <!-- Data Nodes & Value Tags -->
    <!-- W1 -->
    <circle cx="180" cy="405.77" r="7" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
    <rect x="135" y="420" width="90" height="28" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <text x="180" y="439" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">54.35 req/s</text>

    <!-- W2 -->
    <circle cx="390" cy="323.16" r="7" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
    <rect x="345" y="337" width="90" height="28" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <text x="390" y="356" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">90.49 req/s</text>

    <!-- W3 -->
    <circle cx="600" cy="242.5" r="7" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
    <rect x="550" y="257" width="100" height="28" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <text x="600" y="276" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">125.78 req/s</text>

    <!-- W4 (Peak) -->
    <circle cx="810" cy="192.62" r="9" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
    <rect x="740" y="140" width="140" height="34" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
    <text x="810" y="161" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">147.60 req/s (PEAK)</text>

    <!-- W5 -->
    <circle cx="1020" cy="205.22" r="7" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
    <rect x="970" y="220" width="100" height="28" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
    <text x="1020" y="239" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">142.09 req/s</text>

    <!-- Saturation Callout -->
    <rect x="850" y="290" width="220" height="42" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="960" y="308" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📊 Throughput Plateau</text>
    <text x="960" y="324" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Event-loop saturation reached</text>

    <!-- Axis Titles -->
    <text x="600" y="635" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Workload Concurrency Level (Client Requests)</text>
</svg>
