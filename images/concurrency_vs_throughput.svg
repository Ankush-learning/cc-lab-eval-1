<svg width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Dark Canvas Background -->
    <rect width="1000" height="650" fill="#0B0F19"/>

    <!-- Header Titles outside Plot Box -->
    <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Graph 2: Concurrency vs. Throughput</text>
    <text x="32" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Demonstrates throughput scaling and eventual plateau saturation as CPU limits are reached.</text>

    <!-- White Plot Box -->
    <rect x="32" y="85" width="936" height="530" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

    <!-- Inner Chart Title -->
    <text x="500" y="125" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Graph 2: Concurrency vs. Throughput</text>

    <!-- Y-Axis Ticks & Grid Lines: 50, 100, 150, 200, 250, 300, 350 -->
    <!-- Scale: Y=50 -> 520, Y=350 -> 160. Scale factor = (520 - 160) / 300 = 1.2 px/(req/s) -->

    <line x1="100" y1="520" x2="920" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="525" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">50</text>

    <line x1="100" y1="460" x2="920" y2="460" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="465" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">100</text>

    <line x1="100" y1="400" x2="920" y2="400" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="405" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">150</text>

    <line x1="100" y1="340" x2="920" y2="340" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="345" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">200</text>

    <line x1="100" y1="280" x2="920" y2="280" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="285" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">250</text>

    <line x1="100" y1="220" x2="920" y2="220" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="225" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">300</text>

    <line x1="100" y1="160" x2="920" y2="160" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="165" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">350</text>

    <!-- X Grid Lines & Ticks -->
    <line x1="120" y1="160" x2="120" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="120" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">1</text>

    <line x1="200" y1="160" x2="200" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="200" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">2</text>

    <line x1="360" y1="160" x2="360" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="360" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">4</text>

    <line x1="550" y1="160" x2="550" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="550" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">8</text>

    <line x1="900" y1="160" x2="900" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="900" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">16</text>

    <!-- Axes Titles -->
    <text x="510" y="580" fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Concurrency Level (Concurrent Clients)</text>
    <text x="45" y="340" fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90, 45, 340)">Throughput (req/sec)</text>

    <!-- Legend (Top Left) -->
    <rect x="110" y="145" width="200" height="38" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
    <line x1="125" y1="164" x2="155" y2="164" stroke="#16A34A" stroke-width="3"/>
    <circle cx="140" cy="164" r="5" fill="#16A34A"/>
    <text x="165" y="169" fill="#333333" font-family="sans-serif" font-size="13" font-weight="600">Throughput (req/sec)</text>

    <!-- Data Line: (120, 506.44) -> (200, 436.24) -> (360, 237.16) -> (550, 232.12) -> (900, 199.0) -->
    <polyline points="120,506.44 200,436.24 360,237.16 550,232.12 900,199.0" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data Nodes -->
    <circle cx="120" cy="506.44" r="6" fill="#16A34A"/>
    <circle cx="200" cy="436.24" r="6" fill="#16A34A"/>
    <circle cx="360" cy="237.16" r="6" fill="#16A34A"/>
    <circle cx="550" cy="232.12" r="6" fill="#16A34A"/>
    <circle cx="900" cy="199.0" r="6" fill="#16A34A"/>

    <!-- Value Callout Badges -->
    <rect x="80" y="478" width="80" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="120" y="492" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">61.3 req/s</text>

    <rect x="155" y="408" width="90" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="200" y="422" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">119.8 req/s</text>

    <rect x="310" y="210" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="360" y="224" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">285.7 req/s</text>

    <rect x="500" y="204" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="550" y="218" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">289.9 req/s</text>

    <rect x="850" y="171" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="900" y="185" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">317.5 req/s</text>
</svg>
