<svg width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Dark Canvas Background -->
    <rect width="1000" height="650" fill="#0B0F19"/>

    <!-- Header Titles outside Plot Box -->
    <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Graph 1: Concurrency vs. Average Response Time</text>
    <text x="32" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Illustrates latency escalation due to queueing and thread contention under elevated client concurrency.</text>

    <!-- White Plot Box -->
    <rect x="32" y="85" width="936" height="530" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

    <!-- Inner Chart Title -->
    <text x="500" y="125" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Graph 1: Concurrency vs. Average Response Time</text>

    <!-- Plot Area Bounds: X [100 to 920], Y [540 down to 160] -->
    <!-- Grid Lines & Y-Axis Ticks: 15, 20, 25, 30, 35, 40, 45, 50 -->
    <!-- Scale: Y=15 -> 540, Y=50 -> 160. Scale factor = (540 - 160) / 35 = 10.857 px/ms -->

    <!-- Y Grid Lines -->
    <line x1="100" y1="540" x2="920" y2="540" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">15</text>

    <line x1="100" y1="485.7" x2="920" y2="485.7" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="490.7" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">20</text>

    <line x1="100" y1="431.4" x2="920" y2="431.4" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="436.4" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">25</text>

    <line x1="100" y1="377.1" x2="920" y2="377.1" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="382.1" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">30</text>

    <line x1="100" y1="322.8" x2="920" y2="322.8" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="327.8" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">35</text>

    <line x1="100" y1="268.5" x2="920" y2="268.5" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="273.5" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">40</text>

    <line x1="100" y1="214.2" x2="920" y2="214.2" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="219.2" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">45</text>

    <line x1="100" y1="160" x2="920" y2="160" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="165" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">50</text>

    <!-- X Grid Lines & Ticks (Categorical numeric mapping for 1, 2, 4, 8, 16) -->
    <!-- X positions: 1 -> 120, 2 -> 200, 4 -> 360, 8 -> 550, 16 -> 900 -->

    <line x1="120" y1="160" x2="120" y2="540" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="120" y="562" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">1</text>

    <line x1="200" y1="160" x2="200" y2="540" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="200" y="562" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">2</text>

    <line x1="360" y1="160" x2="360" y2="540" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="360" y="562" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">4</text>

    <line x1="550" y1="160" x2="550" y2="540" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="550" y="562" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">8</text>

    <line x1="900" y1="160" x2="900" y2="540" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="900" y="562" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">16</text>

    <!-- Axes Titles -->
    <text x="510" y="595" fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Concurrency Level (Concurrent Clients)</text>
    <text x="45" y="350" fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90, 45, 350)">Response Time (ms)</text>

    <!-- Legend (Top Left Box inside plot area) -->
    <rect x="110" y="145" width="190" height="38" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
    <line x1="125" y1="164" x2="155" y2="164" stroke="#2563EB" stroke-width="3"/>
    <circle cx="140" cy="164" r="5" fill="#2563EB"/>
    <text x="165" y="169" fill="#333333" font-family="sans-serif" font-size="13" font-weight="600">Avg Latency (ms)</text>

    <!-- Data Line: (120, 525.88) -> (200, 521.54) -> (360, 550.86) -> (550, 403.14) -> (900, 155.65) -->
    <polyline points="120,525.88 200,521.54 360,550.86 550,403.14 900,155.65" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data Nodes -->
    <circle cx="120" cy="525.88" r="6" fill="#2563EB"/>
    <circle cx="200" cy="521.54" r="6" fill="#2563EB"/>
    <circle cx="360" cy="550.86" r="6" fill="#2563EB"/>
    <circle cx="550" cy="403.14" r="6" fill="#2563EB"/>
    <circle cx="900" cy="155.65" r="6" fill="#2563EB"/>

    <!-- Value Callout Badges (White Box with Thin Grey Border & Bold Text) -->
    <!-- Point 1: 16.3 ms -->
    <rect x="86" y="500" width="68" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="120" y="514" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">16.3 ms</text>

    <!-- Point 2: 16.7 ms -->
    <rect x="166" y="493" width="68" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="200" y="507" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">16.7 ms</text>

    <!-- Point 3: 14.0 ms -->
    <rect x="326" y="525" width="68" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="360" y="539" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">14.0 ms</text>

    <!-- Point 4: 27.6 ms -->
    <rect x="516" y="378" width="68" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="550" y="392" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">27.6 ms</text>

    <!-- Point 5: 50.4 ms -->
    <rect x="866" y="130" width="68" height="20" rx="3" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
    <text x="900" y="144" fill="#000000" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">50.4 ms</text>
</svg>
