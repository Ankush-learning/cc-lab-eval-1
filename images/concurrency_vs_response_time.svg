<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="respGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
        </linearGradient>
    </defs>
    
    <rect width="1200" height="675" rx="16" fill="#0B0F19"/>
    <rect x="1" y="1" width="1198" height="673" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

    <!-- Header Badge -->
    <rect x="470" y="32" width="260" height="32" rx="16" fill="#1E293B"/>
    <text x="600" y="53" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">LATENCY PERFORMANCE CURVE</text>

    <text x="600" y="98" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Concurrent Requests vs Average Response Time (ms)</text>
    <text x="600" y="123" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Measured latency scaling from W1 (1 req) to W5 (16 req)</text>

    <!-- Chart Frame -->
    <rect x="100" y="160" width="1000" height="420" rx="12" fill="#0F172A" stroke="#1E293B"/>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="140" y1="530" x2="1060" y2="530" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="534" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">0 ms</text>

    <line x1="140" y1="460" x2="1060" y2="460" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="464" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">25 ms</text>

    <line x1="140" y1="390" x2="1060" y2="390" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="394" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">50 ms</text>

    <line x1="140" y1="320" x2="1060" y2="320" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="324" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">75 ms</text>

    <line x1="140" y1="250" x2="1060" y2="250" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="254" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">100 ms</text>

    <line x1="140" y1="180" x2="1060" y2="180" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="184" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">125 ms</text>

    <!-- X-Axis Labels -->
    <text x="180" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W1 (1 Concurrent)</text>
    <text x="390" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W2 (2 Concurrent)</text>
    <text x="600" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W3 (4 Concurrent)</text>
    <text x="810" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W4 (8 Concurrent)</text>
    <text x="1020" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W5 (16 Concurrent)</text>

    <line x1="140" y1="530" x2="1060" y2="530" stroke="#64748B" stroke-width="2"/>

    <!-- Area Gradient & Line Path -->
    <path d="M 180 478.48 L 390 468.12 L 600 440.96 L 810 378.24 L 1020 214.72 L 1020 530 L 180 530 Z" fill="url(#respGrad)"/>
    <path d="M 180 478.48 C 285 478.48, 285 468.12, 390 468.12 C 495 468.12, 495 440.96, 600 440.96 C 705 440.96, 705 378.24, 810 378.24 C 915 378.24, 915 214.72, 1020 214.72" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

    <!-- Data Nodes & Value Tags -->
    <!-- W1 -->
    <circle cx="180" cy="478.48" r="7" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
    <rect x="140" y="435" width="80" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="180" y="454" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">18.4 ms</text>

    <!-- W2 -->
    <circle cx="390" cy="468.12" r="7" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
    <rect x="350" y="425" width="80" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="390" y="444" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">22.1 ms</text>

    <!-- W3 -->
    <circle cx="600" cy="440.96" r="7" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
    <rect x="560" y="398" width="80" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="600" y="417" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">31.8 ms</text>

    <!-- W4 -->
    <circle cx="810" cy="378.24" r="7" fill="#38BDF8" stroke="#0F172A" stroke-width="3"/>
    <rect x="770" y="335" width="80" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="810" y="354" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">54.2 ms</text>

    <!-- W5 -->
    <circle cx="1020" cy="214.72" r="8" fill="#F43F5E" stroke="#0F172A" stroke-width="3"/>
    <rect x="970" y="170" width="100" height="30" rx="6" fill="#9F1239" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="1020" y="190" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">112.6 ms</text>

    <!-- Queueing Delay Callout -->
    <rect x="740" y="240" width="220" height="42" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="850" y="258" fill="#F43F5E" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚠️ Queueing Delay Onset</text>
    <text x="850" y="274" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Socket contention at 16 concurrency</text>

    <!-- Axis Titles -->
    <text x="600" y="635" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Workload Concurrency Level (Client Requests)</text>
</svg>
