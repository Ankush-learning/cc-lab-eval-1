<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="675" rx="16" fill="#0B0F19"/>
    <rect x="1" y="1" width="1198" height="673" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

    <!-- Header Badge -->
    <rect x="450" y="32" width="300" height="32" rx="16" fill="#1E293B"/>
    <text x="600" y="53" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SYSTEM ARCHITECTURE TOPOLOGY</text>
    
    <text x="600" y="100" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Containerized Microservices Communication &amp; Network Layout</text>
    <text x="600" y="125" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Client ➔ enrollment-service ➔ student-service &amp; course-service</text>

    <!-- Outer Docker Network Boundary -->
    <rect x="340" y="165" width="810" height="460" rx="16" fill="#0F172A" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,6"/>
    <rect x="360" y="180" width="280" height="30" rx="6" fill="#1E293B"/>
    <text x="500" y="200" fill="#60A5FA" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Docker Network: microservice-network (bridge)</text>

    <!-- Client Node -->
    <g transform="translate(50, 275)">
        <rect width="230" height="230" rx="14" fill="#151E2E" stroke="#38BDF8" stroke-width="2.5"/>
        <circle cx="115" cy="65" r="32" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
        <path d="M 103 65 L 127 65 M 115 53 L 115 77" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
        <text x="115" y="125" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">HTTP Client</text>
        <text x="115" y="150" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Workload Generator</text>
        <rect x="25" y="170" width="180" height="32" rx="6" fill="#1E293B"/>
        <text x="115" y="191" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">1 - 16 Concurrency (W1-W5)</text>
    </g>

    <!-- Enrollment Service Node -->
    <g transform="translate(390, 250)">
        <rect width="320" height="280" rx="14" fill="#1E1B4B" stroke="#818CF8" stroke-width="2.5"/>
        <rect x="20" y="20" width="280" height="40" rx="8" fill="#312E81"/>
        <text x="160" y="46" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">enrollment-service</text>
        
        <text x="160" y="90" fill="#C7D2FE" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Orchestrator &amp; Aggregator</text>
        <text x="160" y="112" fill="#A5B4FC" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Exposed Port: 3003:3003</text>
        
        <rect x="25" y="130" width="270" height="50" rx="8" fill="#1E293B" stroke="#4338CA" stroke-width="1.5"/>
        <text x="160" y="152" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">POST /enroll</text>
        <text x="160" y="170" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Payload: { studentId: 1, courseId: 101 }</text>

        <rect x="25" y="195" width="270" height="60" rx="8" fill="#151E2E"/>
        <text x="160" y="218" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✔ Fetches Student via DNS</text>
        <text x="160" y="238" fill="#F0ABFC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✔ Fetches Course via DNS</text>
    </g>

    <!-- Student Service Node -->
    <g transform="translate(820, 210)">
        <rect width="290" height="170" rx="14" fill="#064E3B" stroke="#34D399" stroke-width="2.5"/>
        <text x="145" y="45" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">student-service</text>
        <text x="145" y="70" fill="#A7F3D0" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Port: 3001:3001</text>
        
        <rect x="20" y="90" width="250" height="60" rx="8" fill="#022C22"/>
        <text x="145" y="115" fill="#6EE7B7" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET /students/:id</text>
        <text x="145" y="135" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Returns Student JSON Profile</text>
    </g>

    <!-- Course Service Node -->
    <g transform="translate(820, 420)">
        <rect width="290" height="170" rx="14" fill="#701A75" stroke="#F0ABFC" stroke-width="2.5"/>
        <text x="145" y="45" fill="#F0ABFC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">course-service</text>
        <text x="145" y="70" fill="#F5D0FE" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Port: 3002:3002</text>
        
        <rect x="20" y="90" width="250" height="60" rx="8" fill="#4A044E"/>
        <text x="145" y="115" fill="#E879F9" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET /courses/:id</text>
        <text x="145" y="135" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Returns Course Metadata</text>
    </g>

    <!-- Arrows & Flow Markers -->
    <defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
        </marker>
        <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#818CF8"/>
        </marker>
    </defs>

    <!-- Client -> Enrollment Arrow -->
    <line x1="280" y1="390" x2="380" y2="390" stroke="#38BDF8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
    <rect x="295" y="360" width="70" height="24" rx="4" fill="#1E293B"/>
    <text x="330" y="376" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">POST /enroll</text>

    <!-- Enrollment -> Student Arrow -->
    <path d="M 710 330 Q 765 295 810 295" fill="none" stroke="#818CF8" stroke-width="3" marker-end="url(#arrow-indigo)"/>
    <rect x="725" y="285" width="80" height="22" rx="4" fill="#1E293B"/>
    <text x="765" y="300" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. GET Student</text>

    <!-- Enrollment -> Course Arrow -->
    <path d="M 710 450 Q 765 505 810 505" fill="none" stroke="#818CF8" stroke-width="3" marker-end="url(#arrow-indigo)"/>
    <rect x="725" y="495" width="80" height="22" rx="4" fill="#1E293B"/>
    <text x="765" y="510" fill="#F0ABFC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. GET Course</text>
</svg>
