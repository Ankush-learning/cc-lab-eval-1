<svg width="850" height="420" viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">
    <rect width="850" height="420" rx="12" fill="#090d16"/>
    <rect x="1" y="1" width="848" height="418" rx="11" fill="none" stroke="#1e293b" stroke-width="2"/>

    <text x="425" y="38" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Containerized Microservices Architecture &amp; Communication Flow</text>
    
    <!-- Outer Docker Compose Network boundary -->
    <rect x="230" y="80" width="580" height="300" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6"/>
    <text x="245" y="105" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">Docker Network: microservice-network (bridge)</text>

    <!-- Client Box -->
    <rect x="40" y="170" width="140" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="110" y="210" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">HTTP Client</text>
    <text x="110" y="235" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Load Generator</text>
    <text x="110" y="255" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">(1 - 16 Concurrency)</text>

    <!-- Enrollment Service Box -->
    <rect x="270" y="150" width="220" height="150" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <text x="380" y="185" fill="#818cf8" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">enrollment-service</text>
    <text x="380" y="210" fill="#c7d2fe" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Orchestrator Service</text>
    <text x="380" y="235" fill="#a5b4fc" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Port 3003:3003</text>
    <rect x="290" y="250" width="180" height="30" rx="5" fill="#312e81"/>
    <text x="380" y="270" fill="#e0e7ff" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">POST /enroll</text>

    <!-- Student Service Box -->
    <rect x="570" y="110" width="210" height="110" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
    <text x="675" y="145" fill="#34d399" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">student-service</text>
    <text x="675" y="170" fill="#a7f3d0" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Port 3001:3001</text>
    <text x="675" y="195" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GET /students/:id</text>

    <!-- Course Service Box -->
    <rect x="570" y="245" width="210" height="110" rx="10" fill="#701a75" stroke="#f0abfc" stroke-width="2.5"/>
    <text x="675" y="280" fill="#f0abfc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">course-service</text>
    <text x="675" y="305" fill="#f5d0fe" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Port 3002:3002</text>
    <text x="675" y="330" fill="#e879f9" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">GET /courses/:id</text>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
        </marker>
    </defs>
    
    <line x1="180" y1="225" x2="265" y2="225" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="222" y="215" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HTTP POST</text>

    <path d="M 490 195 Q 530 165 565 165" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
    <text x="530" y="160" fill="#a5b4fc" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">1. Fetch Student</text>

    <path d="M 490 255 Q 530 295 565 295" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>
    <text x="530" y="312" fill="#a5b4fc" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">2. Fetch Course</text>
</svg>
