<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="900" fill="#0B0F19"/>

    <text x="32" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Microservices Performance Evaluation — Benchmark Dashboard</text>
    <text x="32" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Comprehensive experimental metrics measured across 5 workload concurrency levels (W1 - W5)</text>

    <!-- Sub-Chart 1: Response Time -->
    <g transform="translate(32, 90)">
        <rect width="550" height="370" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <text x="275" y="30" fill="#000000" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">Graph 1: Concurrency vs. Average Response Time</text>
        <polyline points="60,310 120,305 240,320 380,230 500,80" fill="none" stroke="#2563EB" stroke-width="3"/>
        <circle cx="60" cy="310" r="4" fill="#2563EB"/><text x="60" y="300" fill="#000" font-size="10" font-weight="700" text-anchor="middle">16.3ms</text>
        <circle cx="120" cy="305" r="4" fill="#2563EB"/><text x="120" y="295" fill="#000" font-size="10" font-weight="700" text-anchor="middle">16.7ms</text>
        <circle cx="240" cy="320" r="4" fill="#2563EB"/><text x="240" y="340" fill="#000" font-size="10" font-weight="700" text-anchor="middle">14.0ms</text>
        <circle cx="380" cy="230" r="4" fill="#2563EB"/><text x="380" y="220" fill="#000" font-size="10" font-weight="700" text-anchor="middle">27.6ms</text>
        <circle cx="500" cy="80" r="4" fill="#2563EB"/><text x="500" y="70" fill="#000" font-size="10" font-weight="800" text-anchor="middle">50.4ms</text>
        <text x="275" y="355" fill="#000" font-size="12" font-weight="700" text-anchor="middle">Concurrency Level (Clients)</text>
    </g>

    <!-- Sub-Chart 2: Throughput -->
    <g transform="translate(618, 90)">
        <rect width="550" height="370" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <text x="275" y="30" fill="#000000" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">Graph 2: Concurrency vs. Throughput</text>
        <polyline points="60,320 120,270 240,120 380,115 500,90" fill="none" stroke="#16A34A" stroke-width="3"/>
        <circle cx="60" cy="320" r="4" fill="#16A34A"/><text x="60" y="310" fill="#000" font-size="10" font-weight="700" text-anchor="middle">61.3</text>
        <circle cx="120" cy="270" r="4" fill="#16A34A"/><text x="120" y="260" fill="#000" font-size="10" font-weight="700" text-anchor="middle">119.8</text>
        <circle cx="240" cy="120" r="4" fill="#16A34A"/><text x="240" y="110" fill="#000" font-size="10" font-weight="700" text-anchor="middle">285.7</text>
        <circle cx="380" cy="115" r="4" fill="#16A34A"/><text x="380" y="105" fill="#000" font-size="10" font-weight="700" text-anchor="middle">289.9</text>
        <circle cx="500" cy="90" r="4" fill="#16A34A"/><text x="500" y="80" fill="#000" font-size="10" font-weight="800" text-anchor="middle">317.5 req/s</text>
        <text x="275" y="355" fill="#000" font-size="12" font-weight="700" text-anchor="middle">Concurrency Level (Clients)</text>
    </g>

    <!-- Sub-Chart 3: CPU Utilization -->
    <g transform="translate(32, 490)">
        <rect width="550" height="370" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <text x="275" y="30" fill="#000000" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">Graph 3: Concurrency vs. CPU Utilization</text>
        <polyline points="60,310 120,295 240,260 380,190 500,80" fill="none" stroke="#4F46E5" stroke-width="3"/>
        <polyline points="60,320 120,310 240,295 380,265 500,210" fill="none" stroke="#16A34A" stroke-width="2.5"/>
        <polyline points="60,322 120,312 240,297 380,268 500,215" fill="none" stroke="#D946EF" stroke-width="2.5"/>
        <text x="60" y="355" fill="#4F46E5" font-size="11" font-weight="700">■ enrollment (63.8%)</text>
        <text x="220" y="355" fill="#16A34A" font-size="11" font-weight="700">■ student (29.4%)</text>
        <text x="370" y="355" fill="#D946EF" font-size="11" font-weight="700">■ course (27.9%)</text>
    </g>

    <!-- Sub-Chart 4: Memory Utilization -->
    <g transform="translate(618, 490)">
        <rect width="550" height="370" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
        <text x="275" y="30" fill="#000000" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">Graph 4: Concurrency vs. Memory Utilization</text>
        <polyline points="60,240 120,230 240,210 380,175 500,120" fill="none" stroke="#EA580C" stroke-width="3"/>
        <polyline points="60,300 120,295 240,285 380,265 500,240" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
        <polyline points="60,310 120,308 240,300 380,290 500,275" fill="none" stroke="#16A34A" stroke-width="2.5"/>
        <text x="60" y="355" fill="#EA580C" font-size="11" font-weight="700">■ Total Memory (161.8MB)</text>
        <text x="240" y="355" fill="#4F46E5" font-size="11" font-weight="700">■ enrollment</text>
        <text x="360" y="355" fill="#16A34A" font-size="11" font-weight="700">■ student</text>
    </g>
</svg>
