    <rect x="170" y="194" width="16" height="12" rx="3" fill="#818CF8"/>
    <text x="192" y="205" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">enrollment-service</text>

    <rect x="330" y="194" width="16" height="12" rx="3" fill="#34D399"/>
    <text x="352" y="205" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">student-service</text>

