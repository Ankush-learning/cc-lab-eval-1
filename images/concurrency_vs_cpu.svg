    <text x="125" y="394" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">30%</text>

    <line x1="140" y1="320" x2="1060" y2="320" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="324" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">45%</text>

