<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="675" rx="16" fill="#0B0F19"/>
    <rect x="1" y="1" width="1198" height="673" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

    <!-- Header Badge -->
    <rect x="470" y="32" width="260" height="32" rx="16" fill="#1E293B"/>
    <text x="600" y="53" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">MEMORY FOOTPRINT ANALYSIS</text>

    <text x="600" y="98" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">Concurrent Requests vs Memory Utilization (MB)</text>
    <text x="600" y="123" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">RAM footprint expansion per container across workload levels W1 to W5</text>

    <!-- Chart Frame -->
    <rect x="100" y="160" width="1000" height="420" rx="12" fill="#0F172A" stroke="#1E293B"/>

    <!-- Y-Axis Grid Lines & Labels -->
    <line x1="140" y1="530" x2="1060" y2="530" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="534" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">0 MB</text>

    <line x1="140" y1="450" x2="1060" y2="450" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="454" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">40 MB</text>

    <line x1="140" y1="370" x2="1060" y2="370" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="374" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">80 MB</text>

    <line x1="140" y1="290" x2="1060" y2="290" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="294" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">120 MB</text>

    <line x1="140" y1="210" x2="1060" y2="210" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="214" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">160 MB</text>

    <line x1="140" y1="180" x2="1060" y2="180" stroke="#334155" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="125" y="184" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="end">180 MB</text>

    <!-- X-Axis Labels -->
    <text x="180" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W1 (1)</text>
    <text x="390" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W2 (2)</text>
    <text x="600" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W3 (4)</text>
    <text x="810" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W4 (8)</text>
    <text x="1020" y="565" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">W5 (16)</text>

    <line x1="140" y1="530" x2="1060" y2="530" stroke="#64748B" stroke-width="2"/>

    <!-- Total Memory line (#FBBF24) -->
    <path d="M 180 317 C 285 317, 285 308.4, 390 308.4 C 495 308.4, 495 291.2, 600 291.2 C 705 291.2, 705 257.8, 810 257.8 C 915 257.8, 915 206.4, 1020 206.4" fill="none" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round"/>
