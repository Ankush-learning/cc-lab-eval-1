<svg width="1000" height="650" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Dark Canvas Background -->
    <rect width="1000" height="650" fill="#0B0F19"/>

    <!-- Header Titles outside Plot Box -->
    <text x="32" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Graph 4: Concurrency vs. Memory Utilization</text>
    <text x="32" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Illustrates RAM footprint scaling across services as concurrent connection contexts expand.</text>

    <!-- White Plot Box -->
    <rect x="32" y="85" width="936" height="530" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

    <!-- Inner Chart Title -->
    <text x="500" y="125" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Graph 4: Concurrency vs. Memory Utilization</text>

    <!-- Y-Axis Ticks: 0, 30, 60, 90, 120, 150, 180 MB -->
    <!-- Scale: Y=0 -> 520, Y=180 -> 160. Scale factor = (520 - 160) / 180 = 2.0 px/MB -->

    <line x1="100" y1="520" x2="920" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="525" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">0</text>

    <line x1="100" y1="460" x2="920" y2="460" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="465" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">30</text>

    <line x1="100" y1="400" x2="920" y2="400" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="405" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">60</text>

    <line x1="100" y1="340" x2="920" y2="340" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="345" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">90</text>

    <line x1="100" y1="280" x2="920" y2="280" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="285" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">120</text>

    <line x1="100" y1="220" x2="920" y2="220" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="225" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">150</text>

    <line x1="100" y1="160" x2="920" y2="160" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="85" y="165" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="end">180</text>

    <!-- X Grid Lines & Ticks -->
    <line x1="120" y1="160" x2="120" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="120" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">1</text>

    <line x1="200" y1="160" x2="200" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="200" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">2</text>

    <line x1="360" y1="160" x2="360" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="360" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">4</text>

    <line x1="550" y1="160" x2="550" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="550" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">8</text>

    <line x1="900" y1="160" x2="900" y2="520" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="900" y="545" fill="#000000" font-family="sans-serif" font-size="14" text-anchor="middle">16</text>

    <!-- Axes Titles -->
    <text x="510" y="580" fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Concurrency Level (Concurrent Clients)</text>
    <text x="45" y="340" fill="#000000" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90, 45, 340)">Memory Utilization (MB)</text>

    <!-- Legend (Top Left Box) -->
    <rect x="110" y="145" width="560" height="38" rx="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5"/>
    <line x1="125" y1="164" x2="145" y2="164" stroke="#EA580C" stroke-width="3"/><circle cx="135" cy="164" r="4" fill="#EA580C"/>
    <text x="152" y="169" fill="#333333" font-family="sans-serif" font-size="12" font-weight="600">Total Memory</text>

    <line x1="265" y1="164" x2="285" y2="164" stroke="#4F46E5" stroke-width="3"/><circle cx="275" cy="164" r="4" fill="#4F46E5"/>
    <text x="292" y="169" fill="#333333" font-family="sans-serif" font-size="12" font-weight="600">enrollment-service</text>

    <line x1="425" y1="164" x2="445" y2="164" stroke="#16A34A" stroke-width="3"/><circle cx="435" cy="164" r="4" fill="#16A34A"/>
    <text x="452" y="169" fill="#333333" font-family="sans-serif" font-size="12" font-weight="600">student-service</text>

    <line x1="565" y1="164" x2="585" y2="164" stroke="#D946EF" stroke-width="3"/><circle cx="575" cy="164" r="4" fill="#D946EF"/>
    <text x="592" y="169" fill="#333333" font-family="sans-serif" font-size="12" font-weight="600">course-service</text>

    <!-- Total Memory line (#EA580C): (120, 307.0) -> (200, 298.4) -> (360, 281.2) -> (550, 247.8) -> (900, 196.4) -->
    <polyline points="120,307.0 200,298.4 360,281.2 550,247.8 900,196.4" fill="none" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="120" cy="307.0" r="5" fill="#EA580C"/>
    <circle cx="200" cy="298.4" r="5" fill="#EA580C"/>
    <circle cx="360" cy="281.2" r="5" fill="#EA580C"/>
    <circle cx="550" cy="247.8" r="5" fill="#EA580C"/>
    <circle cx="900" cy="196.4" r="5" fill="#EA580C"/>
    <rect x="850" y="172" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#EA580C" stroke-width="1"/>
    <text x="900" y="186" fill="#EA580C" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">161.8 MB (Total)</text>

    <!-- enrollment-service line (#4F46E5): (120, 443.0) -> (200, 437.6) -> (360, 428.4) -> (550, 410.8) -> (900, 383.2) -->
    <polyline points="120,443.0 200,437.6 360,428.4 550,410.8 900,383.2" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="443.0" r="4" fill="#4F46E5"/>
    <circle cx="200" cy="437.6" r="4" fill="#4F46E5"/>
    <circle cx="360" cy="428.4" r="4" fill="#4F46E5"/>
    <circle cx="550" cy="410.8" r="4" fill="#4F46E5"/>
    <circle cx="900" cy="383.2" r="4" fill="#4F46E5"/>

    <!-- student-service line (#16A34A): (120, 451.6) -> (200, 449.8) -> (360, 445.2) -> (550, 436.4) -> (900, 423.4) -->
    <polyline points="120,451.6 200,449.8 360,445.2 550,436.4 900,423.4" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="451.6" r="4" fill="#16A34A"/>
    <circle cx="200" cy="449.8" r="4" fill="#16A34A"/>
    <circle cx="360" cy="445.2" r="4" fill="#16A34A"/>
    <circle cx="550" cy="436.4" r="4" fill="#16A34A"/>
    <circle cx="900" cy="423.4" r="4" fill="#16A34A"/>

    <!-- course-service line (#D946EF): (120, 452.4) -> (200, 451.0) -> (360, 447.6) -> (550, 440.6) -> (900, 429.8) -->
    <polyline points="120,452.4 200,451.0 360,447.6 550,440.6 900,429.8" fill="none" stroke="#D946EF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="452.4" r="4" fill="#D946EF"/>
    <circle cx="200" cy="451.0" r="4" fill="#D946EF"/>
    <circle cx="360" cy="447.6" r="4" fill="#D946EF"/>
    <circle cx="550" cy="440.6" r="4" fill="#D946EF"/>
    <circle cx="900" cy="429.8" r="4" fill="#D946EF"/>
</svg>
