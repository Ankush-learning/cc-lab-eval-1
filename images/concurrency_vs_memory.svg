    <circle cx="180" cy="453" r="5" fill="#818CF8"/>
    <circle cx="390" cy="447.6" r="5" fill="#818CF8"/>
    <circle cx="600" cy="438.4" r="5" fill="#818CF8"/>
    <circle cx="810" cy="420.8" r="5" fill="#818CF8"/>
    <circle cx="1020" cy="393.2" r="6" fill="#818CF8"/>
    <text x="1020" y="380" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">68.4 MB</text>

