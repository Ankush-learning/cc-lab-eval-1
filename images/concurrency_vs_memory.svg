    <circle cx="390" cy="308.4" r="6" fill="#FBBF24"/>
    <circle cx="600" cy="291.2" r="6" fill="#FBBF24"/>
    <circle cx="810" cy="257.8" r="6" fill="#FBBF24"/>
    <circle cx="1020" cy="206.4" r="8" fill="#FBBF24" stroke="#0F172A" stroke-width="3"/>
    <text x="1020" y="190" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">161.8 MB (Total)</text>

