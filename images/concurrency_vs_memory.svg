    <path d="M 180 461.6 C 285 461.6, 285 459.8, 390 459.8 C 495 459.8, 495 455.2, 600 455.2 C 705 455.2, 705 446.4, 810 446.4 C 915 446.4, 915 433.4, 1020 433.4" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="180" cy="461.6" r="4" fill="#34D399"/>
    <circle cx="390" cy="459.8" r="4" fill="#34D399"/>
    <circle cx="600" cy="455.2" r="4" fill="#34D399"/>
    <circle cx="810" cy="446.4" r="4" fill="#34D399"/>
    <circle cx="1020" cy="433.4" r="5" fill="#34D399"/>

    <!-- course-service line (#F0ABFC) -->
    <path d="M 180 462.4 C 285 462.4, 285 461, 390 461 C 495 461, 495 457.6, 600 457.6 C 705 457.6, 705 450.6, 810 450.6 C 915 450.6, 915 439.8, 1020 439.8" fill="none" stroke="#F0ABFC" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="180" cy="462.4" r="4" fill="#F0ABFC"/>
    <circle cx="390" cy="461" r="4" fill="#F0ABFC"/>
    <circle cx="600" cy="457.6" r="4" fill="#F0ABFC"/>
    <circle cx="810" cy="450.6" r="4" fill="#F0ABFC"/>
    <circle cx="1020" cy="439.8" r="5" fill="#F0ABFC"/>

    <!-- Legends Box -->
    <rect x="150" y="180" width="620" height="40" rx="8" fill="#1E293B" opacity="0.9"/>
    <rect x="170" y="194" width="16" height="12" rx="3" fill="#FBBF24"/>
    <text x="192" y="205" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Total System Memory</text>

    <rect x="360" y="194" width="16" height="12" rx="3" fill="#818CF8"/>
    <text x="382" y="205" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">enrollment-service</text>

    <rect x="520" y="194" width="16" height="12" rx="3" fill="#34D399"/>
    <text x="542" y="205" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">student-service</text>

    <rect x="660" y="194" width="16" height="12" rx="3" fill="#F0ABFC"/>
    <text x="682" y="205" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">course-service</text>

    <text x="600" y="635" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Workload Concurrency Level (Client Requests)</text>
</svg>
